# Decap CMS Configuration for kaban.blog
# Static Astro site deployed by Netlify

backend:
  name: github
  repo: Maligrond/kaban.blog
  site_domain: kaban.blog
  squash_merges: true
  branch: main

# Allow direct local editing when running npx decap-server
local_backend: true

# Saving drafts creates a branch; publishing merges it into main.
publish_mode: editorial_workflow
locale: ru
display_url: https://kaban.blog

site_url: https://kaban.blog
logo_url: /android-chrome-512x512.png

# Media settings
media_folder: "public/uploads"
public_folder: "/uploads"

# Slug settings - use clean URLs
slug:
  encoding: "unicode"
  clean_accents: true
  sanitize_replacement: "-"

# Performance: limit preview styles
show_preview_links: false

collections:
  - name: pages
    label: "Страницы"
    files:
      - name: now
        label: "Сейчас"
        file: "src/content/pages/now/index.md"
        fields:
          - { label: "Заголовок", name: "title", widget: "string" }
          - { label: "Описание", name: "description", widget: "text" }
          - { label: "Дата обновления", name: "updated", widget: "datetime", date_format: "YYYY-MM-DD", time_format: false }
          - { label: "Текст", name: "body", widget: "markdown" }

  # Blog Posts
  - name: blog
    label: "Записи"
    label_singular: "Запись"
    folder: "src/content/blog"
    create: true
    slug: "{{slug}}"
    path: "{{slug}}/index"
    extension: "md"
    format: "frontmatter"
    summary: "{{title}} · {{date | date('DD.MM.YYYY')}}"
    sortable_fields: ['date', 'title']
    media_folder: ""
    public_folder: ""
    view_filters:
      - label: Черновики
        field: draft
        pattern: true
      - label: Опубликованные
        field: draft
        pattern: false
    fields:
      - { label: "Формат", name: "format", widget: "select", default: "article", options: [{ label: "История", value: "article" }, { label: "Короткая запись", value: "note" }, { label: "Фотопост", value: "photo" }, { label: "Ссылка с комментарием", value: "link" }] }
      - { label: "Адрес ссылки", name: "linkURL", widget: "string", required: false }
      - { label: "Заголовок", name: "title", widget: "string", required: true }
      - { label: "Текст", name: "body", widget: "markdown", hint: "В Markdown можно использовать :::details Заголовок … :::, сноски [^note] с пояснением [^note]: Текст, и полный URL отдельным абзацем для карточки. Примеры есть в подсказке встроенного редактора." }
      - { label: "Короткое описание", name: "description", widget: "text", required: true, hint: "Одно-два предложения для превью и поисковиков." }
      - { label: "Дата", name: "date", widget: "datetime", date_format: "YYYY-MM-DD", time_format: false, required: true }
      - { label: "Скрыть с сайта", name: "draft", widget: "boolean", default: false, required: false, hint: "Это отдельный переключатель видимости. Неопубликованные черновики сохраняются кнопкой редактора." }
      - { label: "Теги", name: "tags", widget: "list", default: [], required: false }
      - { label: "Города из записи", name: "cities", widget: "relation", collection: "countries", search_fields: ["title", "country"], value_field: "{{slug}}", display_fields: ["title"], multiple: true, required: false }
      - { label: "Избранная запись на главной", name: "featured", widget: "boolean", default: false, required: false }
      - { label: "Текст превью", name: "excerpt", widget: "text", required: false }
      - { label: "Обложка", name: "cover", widget: "image", required: false, hint: "Сохраняется в папке записи; появится в рекомендациях." }
      - { label: "Описание обложки", name: "coverAlt", widget: "string", required: false }
      - { label: "Картинка для ссылки", name: "previewImage", widget: "image", media_folder: "/public/uploads", public_folder: "/uploads", required: false }

  # Books
  - name: books
    label: "📚 Книги"
    label_singular: "Книга"
    folder: "src/content/books"
    create: true
    slug: "{{slug}}"
    extension: "md"
    format: "frontmatter"
    sortable_fields: ['date', 'rating', 'title']
    fields:
      - { label: "Название", name: "title", widget: "string", required: true }
      - { label: "Автор", name: "author", widget: "string", required: true }
      - { label: "Дата прочтения", name: "date", widget: "datetime", date_format: "YYYY-MM-DD", time_format: false, required: true }
      - { label: "Оценка", name: "rating", widget: "number", value_type: "int", min: 1, max: 5, step: 1, required: true }
      - { label: "Пометка", name: "status", widget: "select", required: false, options: [{ label: "Читаю", value: "reading" }, { label: "Перечитываю", value: "rereading" }, { label: "Любимая", value: "favorite" }, { label: "Прочитал", value: "finished" }, { label: "Забросил", value: "dropped" }] }
      - { label: "Обложка", name: "cover", widget: "image", required: false, media_folder: "", public_folder: "" }
      - { label: "Обложка по ссылке", name: "coverURL", widget: "string", required: false }
      - { label: "Описание обложки", name: "coverAlt", widget: "string", required: false }
      - { label: "Убрать стандартную обложку", name: "coverDisabled", widget: "boolean", required: false, default: false }
      - { label: "Черновик", name: "draft", widget: "boolean", default: false, required: false }
      - { label: "Ссылка", name: "url", widget: "string", required: false }
      - { label: "Заметки", name: "body", widget: "markdown", required: false }

  # Games
  - name: games
    label: "🎮 Игры"
    label_singular: "Игра"
    folder: "src/content/games"
    create: true
    slug: "{{slug}}"
    extension: "md"
    format: "frontmatter"
    sortable_fields: ['date', 'rating', 'year']
    fields:
      - { label: "Название", name: "title", widget: "string", required: true }
      - { label: "Год выхода", name: "year", widget: "number", value_type: "int", required: true }
      - { label: "Дата", name: "date", widget: "datetime", date_format: "YYYY-MM-DD", time_format: false, required: true }
      - { label: "Оценка", name: "rating", widget: "number", value_type: "int", min: 1, max: 5, step: 1, required: true }
      - { label: "Пометка", name: "status", widget: "select", required: false, options: [{ label: "Играю", value: "playing" }, { label: "Перепрохожу", value: "replaying" }, { label: "Любимая", value: "favorite" }, { label: "Прошёл", value: "finished" }, { label: "Забросил", value: "dropped" }] }
      - { label: "Обложка", name: "cover", widget: "image", required: false, media_folder: "", public_folder: "" }
      - { label: "Обложка по ссылке", name: "coverURL", widget: "string", required: false }
      - { label: "Описание обложки", name: "coverAlt", widget: "string", required: false }
      - { label: "Убрать стандартную обложку", name: "coverDisabled", widget: "boolean", required: false, default: false }
      - { label: "Черновик", name: "draft", widget: "boolean", default: false, required: false }
      - { label: "Ссылка", name: "url", widget: "string", required: false }
      - { label: "Заметки", name: "body", widget: "markdown", required: false }

  # Movies
  - name: movies
    label: "🎬 Фильмы"
    label_singular: "Фильм"
    folder: "src/content/movies"
    create: true
    slug: "{{slug}}"
    extension: "md"
    format: "frontmatter"
    sortable_fields: ['date', 'rating', 'year']
    fields:
      - { label: "Название", name: "title", widget: "string", required: true }
      - { label: "Год выхода", name: "year", widget: "number", value_type: "int", required: true }
      - { label: "Дата просмотра", name: "date", widget: "datetime", date_format: "YYYY-MM-DD", time_format: false, required: true }
      - { label: "Оценка", name: "rating", widget: "number", value_type: "int", min: 1, max: 5, step: 1, required: true }
      - { label: "Черновик", name: "draft", widget: "boolean", default: false, required: false }
      - { label: "Ссылка", name: "url", widget: "string", required: false }
      - { label: "Заметки", name: "body", widget: "markdown", required: false }

  # Countries
  - name: countries
    label: "🌍 Города"
    label_singular: "Город"
    folder: "src/content/countries"
    create: true
    slug: "{{slug}}"
    extension: "md"
    format: "frontmatter"
    sortable_fields: ['date', 'rating', 'title']
    fields:
      - { label: "Название", name: "title", widget: "string", required: true }
      - { label: "Название страны", name: "country", widget: "string", required: true, hint: "Полное название по-русски, например Германия" }
      - { label: "Фотография для раздела Мир", name: "photo", widget: "string", required: false, hint: "Путь к фотографии относительно файла города, например ../blog/italy/italy.jpg" }
      - { label: "Описание фотографии", name: "photoAlt", widget: "string", required: false }
      - label: "Координаты вручную — необязательно"
        name: "coordinates"
        widget: "list"
        required: false
        min: 2
        max: 2
        hint: "Оставь пустым: при публикации карта найдёт город по названию и стране. Заполняй только для уточнения места: сначала широта, затем долгота. Например, Рапалло: 44.3496 и 9.22796."
        field: { label: "Координата", name: "value", widget: "number", value_type: "float" }
      - { label: "Дата поездки", name: "date", widget: "datetime", date_format: "YYYY-MM-DD", time_format: false, required: true }
      - { label: "Оценка", name: "rating", widget: "number", value_type: "int", min: 1, max: 5, step: 1, required: true }
      - { label: "Черновик", name: "draft", widget: "boolean", default: false, required: false }
      - { label: "Флаг (эмодзи)", name: "flag", widget: "string", required: true }
      - { label: "Избранное", name: "favorite", widget: "boolean", required: false }
      - { label: "Заметки", name: "body", widget: "markdown", required: false }

  # Bookmarks
  - name: bookmarkItems
    label: "🔖 Закладки"
    files:
      - name: items
        label: "Все закладки"
        file: "src/content/bookmarkItems/items.json"
        fields:
          - label: "Закладки"
            name: "items"
            widget: "list"
            fields:
              - { label: "Название", name: "title", widget: "string", required: true }
              - { label: "URL", name: "url", widget: "string", required: true }
              - { label: "Описание", name: "description", widget: "text", required: false }
              - { label: "Дата добавления", name: "date", widget: "datetime", date_format: "YYYY-MM-DD", time_format: false, required: true }
              - { label: "Теги", name: "tags", widget: "list", default: [], required: false }
